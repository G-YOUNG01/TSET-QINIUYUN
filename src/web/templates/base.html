<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>{% block title %}novel2comic Web{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f5f5; color: #222; }
    header { margin-bottom: 2rem; }
    nav a { margin-right: 1rem; color: #1a73e8; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #e0e0e0; text-align: left; }
    .status-success { color: #0f9d58; }
    .status-error { color: #d93025; }
    .status-running { color: #f9ab00; }
    .status-pending { color: #5f6368; }
    form .field { margin-bottom: 1rem; }
    form label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    form input[type="text"], form input[type="number"], form select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
    form input[type="file"] { border: 1px solid #ccc; border-radius: 4px; padding: 0.5rem; background: #fafafa; }
    form button { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 0.6rem 1.2rem; cursor: pointer; }
    form button:hover { background: #1765c4; }
    .error-trace { background: #fbe9e7; color: #c62828; padding: 1rem; border-radius: 6px; white-space: pre-wrap; font-family: Consolas, monospace; }
    .meta-list { list-style: none; padding: 0; }
    .meta-list li { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>novel2comic Web 控制台</h1>
    <nav>
      <a href="/">任务面板</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
