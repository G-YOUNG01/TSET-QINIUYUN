[project]
name = "novel2comic"
version = "0.1.0"
description = "Pipeline to convert novel chapters into comic panels using LLM, image generation, and TTS"
readme = "README.md"
authors = [{name = "Your Name"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
novel2comic = "src.cli:main"
novel2comic-web = "src.web.app:main"

[tool.setuptools]
packages = ["src"]
